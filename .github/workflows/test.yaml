name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest-homeassistant-custom-component
      - name: Run pytest
        run: pytest
