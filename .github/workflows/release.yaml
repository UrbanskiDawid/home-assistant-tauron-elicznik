name: Release

# Push a tag like v1.2.3 to publish a release:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

env:
  COMPONENT: tauron_energy

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set manifest version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' "custom_components/$COMPONENT/manifest.json" > manifest.tmp
          mv manifest.tmp "custom_components/$COMPONENT/manifest.json"
          cat "custom_components/$COMPONENT/manifest.json"

      - name: Zip integration
        run: |
          cd "custom_components/$COMPONENT"
          zip -r "$GITHUB_WORKSPACE/$COMPONENT.zip" . -x "*__pycache__*"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.COMPONENT }}.zip
          generate_release_notes: true
